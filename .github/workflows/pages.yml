name: Publish the bridge test page

# Builds test-page/ into site/ and publishes it with GitHub Pages at
# https://egmutza.github.io/slimtv-game-bridge/test/, the address SlimTV's built-in
# Bridge Test tile opens.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job runs npm ci and the build, so it gets only read access. Publishing rights go to
# the deploy job alone, which runs no code from this repo.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to exact commits, not tags, so a moved tag can't change what runs here.
# The comment after each one names the release it is.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
